services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: opsdesk
      POSTGRES_USER: opsdesk
      POSTGRES_PASSWORD: opsdesk123
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - opsdesk_pgdata:/var/lib/postgresql/data
    # Security constraint: PostgreSQL port is NOT exposed to the host
    networks:
      - opsdesk_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://opsdesk:opsdesk123@db:5432/opsdesk
      JWT_SECRET: opsdesk-insecure-presentation-secret-key-2026
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      # Security constraint: Bound strictly to localhost (127.0.0.1)
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
    networks:
      - opsdesk_net

volumes:
  opsdesk_pgdata:

networks:
  opsdesk_net:
    driver: bridge

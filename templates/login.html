{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto;">
    <div class="card">
        <h2 class="card-title" style="text-align: center;">Sign In to OpsDesk</h2>
        
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus autocomplete="off" placeholder="e.g. alice">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Sign In</button>
        </form>

        <div class="hint-box">
            <strong>Demo Credentials:</strong><br>
            &bull; <code>alice / alice123</code> (Role: user)<br>
            &bull; <code>bob / bob123</code> (Role: user)<br>
            &bull; <code>admin / admin123</code> (Role: admin)
        </div>
    </div>
</div>
{% endblock %}
